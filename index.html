<body>

    <div class="container">
        <h1>FN Asset Path Finder</h1>
        <p class="description">Search Fortnite game asset paths, format them for UEFN, and copy instantly.</p>
        
        <input type="text" id="search" class="search-box" placeholder="Type keyword to search assets (e.g., Peely, Shotgun)..." disabled />
        
        <div id="status" class="status">Loading Fortnite asset data...</div>
        <div id="results" class="results-container"></div>
    </div>

    <script>
        let assetData = [];

        // De twee gecomprimeerde databestanden in de root-map
        const DATA_FILES = [
            './fortnite_assets_all.gz',
            './fortnite_assets_new.gz'
        ]; 

        const searchInput = document.getElementById('search');
        const statusDiv = document.getElementById('status');
        const resultsDiv = document.getElementById('results');

        // Helperfunctie om een .gz bestand te downloaden en te decompileren naar JSON
        async function fetchAndDecompressGz(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Failed to load ${url}`);
            
            // Gebruik de native browser DecompressionStream voor gzip
            const ds = new DecompressionStream('gzip');
            const decompressedStream = response.body.pipeThrough(ds);
            
            // Lees de stream uit als tekst en converteer naar JSON
            const text = await new Response(decompressedStream).text();
            return JSON.parse(text);
        }

        // Laad beide .gz bestanden in en voeg ze samen
        async function loadAssets() {
            try {
                statusDiv.innerText = "Decompressing and loading asset files...";
                
                // Laad beide bestanden tegelijkertijd in
                const [allAssets, newAssets] = await Promise.all([
                    fetchAndDecompressGz(DATA_FILES[0]),
                    fetchAndDecompressGz(DATA_FILES[1])
                ]);

                // Voeg beide arrays samen tot één grote lijst
                assetData = [...allAssets, ...newAssets];
                
                statusDiv.innerText = `Successfully loaded ${assetData.length} assets from compressed packages.`;
                searchInput.disabled = false;
                searchInput.focus();
            } catch (error) {
                statusDiv.innerHTML = `<span style="color: #ef4444;">Error: Could not load or decompress .gz files. Ensure both '${DATA_FILES[0]}' and '${DATA_FILES[1]}' exist in the root directory.</span>`;
                console.error(error);
            }
        }

        // Formatteer pad naar UEFN stijl
        function formatToUEFN(rawPath) {
            if (!rawPath) return '';
            let clean = rawPath.split('.')[0];
            let parts = clean.split('/');
            let objectName = parts[parts.length - 1];
            return `${clean}.${objectName}`;
        }

        // Zoekfunctie
        function handleSearch(e) {
            const query = e.target.value.toLowerCase().trim();
            resultsDiv.innerHTML = '';

            if (query.length < 2) {
                statusDiv.innerText = query.length === 0 ? `Total assets: ${assetData.length}` : 'Type at least 2 characters...';
                return;
            }

            const filtered = assetData.filter(item => {
                const nameMatch = item.name && item.name.toLowerCase().includes(query);
                const pathMatch = item.path && item.path.toLowerCase().includes(query);
                return nameMatch || pathMatch;
            }).slice(0, 50); 

            statusDiv.innerText = `Found ${filtered.length} matches (showing max 50).`;

            if (filtered.length === 0) {
                resultsDiv.innerHTML = '<div class="status">No assets found matching that keyword.</div>';
                return;
            }

            filtered.forEach(item => {
                const uefnPath = formatToUEFN(item.path);
                
                const card = document.createElement('div');
                card.className = 'asset-card';
                
                card.innerHTML = `
                    <div class="asset-name">${item.name || 'Unnamed Asset'}</div>
                    <div>
